name: AppPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apppulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Test suite
        run: bun test
        env:
          APP_SQLITE_PATH: /tmp/apppulse-unit-${{ github.run_id }}-${{ github.run_attempt }}.db

      - name: Local Express server smoke test
        shell: bash
        env:
          AUTH_RATE_LIMIT_SECRET: ci-only-${{ github.run_id }}-${{ github.sha }}-local-auth-rate-limit
          APP_SQLITE_PATH: /tmp/apppulse-local-smoke-${{ github.run_id }}-${{ github.run_attempt }}.db
        run: |
          set -euo pipefail
          PORT=4180 NODE_ENV=test bun run dev > /tmp/apppulse-local-smoke.log 2>&1 &
          server_pid=$!
          trap 'status=$?; kill "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then echo "::group::Local Express smoke log"; cat /tmp/apppulse-local-smoke.log || true; echo "::endgroup::"; fi; exit "$status"' EXIT
          base="http://127.0.0.1:4180"
          code=""
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/apppulse-local-demo.json -w '%{http_code}' "$base/api/demo" || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          test "$code" = "200"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/auth/me")"
          test "$code" = "401"

      - name: Public demo function works without a database
        shell: bash
        run: |
          set -euo pipefail
          PORT=4178 NODE_ENV=production VERCEL=1 bun run scripts/vercel-api-smoke.ts > /tmp/apppulse-demo-smoke.log 2>&1 &
          server_pid=$!
          trap 'status=$?; kill "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then echo "::group::Vercel demo smoke log"; cat /tmp/apppulse-demo-smoke.log || true; echo "::endgroup::"; fi; exit "$status"' EXIT
          base="http://127.0.0.1:4178"
          code=""
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/apppulse-demo.json -w '%{http_code}' "$base/api/demo" || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          test "$code" = "200"
          node -e 'const d=require("/tmp/apppulse-demo.json");if(d.mode!=="demo"||!d.apps.length||!d.reviews.length||!d.apps.every(x=>x.isDemo===true)||!d.reviews.every(x=>x.isDemo===true)||!/Illustrative sample records/.test(d.notice))process.exit(1)'
          code="$(curl -sS -o /tmp/apppulse-no-database.json -w '%{http_code}' "$base/api/auth/me")"
          test "$code" = "503"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/demo")"
          test "$code" = "200"

      - name: API authentication smoke test
        shell: bash
        env:
          # Isolated test-only secret; never used by a deployed environment.
          AUTH_RATE_LIMIT_SECRET: ci-only-${{ github.run_id }}-${{ github.sha }}-auth-rate-limit
          APP_SQLITE_PATH: /tmp/apppulse-auth-smoke-${{ github.run_id }}-${{ github.run_attempt }}.db
          APP_BOOTSTRAP_ADMIN_EMAIL: ci-admin-${{ github.run_id }}@example.test
          APP_BOOTSTRAP_ADMIN_PASSWORD: CiOnlyAdminPassword2026-${{ github.run_id }}!
          VERCEL: '1'
        run: |
          set -euo pipefail
          PORT=4179 NODE_ENV=test bun run scripts/vercel-api-smoke.ts > /tmp/apppulse-auth-smoke.log 2>&1 &
          server_pid=$!
          trap 'status=$?; kill "$server_pid" 2>/dev/null || true; if [ "$status" -ne 0 ]; then echo "::group::API server startup log"; cat /tmp/apppulse-auth-smoke.log || true; echo "::endgroup::"; fi; exit "$status"' EXIT
          base="http://127.0.0.1:4179"
          demo_code=""
          for attempt in $(seq 1 30); do
            demo_code="$(curl -sS -o /tmp/apppulse-demo.json -w '%{http_code}' "$base/api/demo" || true)"
            if [ "$demo_code" = "200" ]; then break; fi
            sleep 1
          done
          test "$demo_code" = "200"
          node -e 'const d=require("/tmp/apppulse-demo.json"); if(d.mode!=="demo" || !d.apps.length || !d.reviews.length || !d.apps.every(x=>x.isDemo===true) || !d.reviews.every(x=>x.isDemo===true) || !/Illustrative sample records/.test(d.notice)) process.exit(1)'
          code=""
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/auth/me" || true)"
            if [ "$code" = "401" ]; then break; fi
            sleep 1
          done
          test "$code" = "401"
          code="$(curl -sS -H 'Cookie: app_session=%E0%A4%A' -o /dev/null -w '%{http_code}' "$base/api/auth/me")"
          test "$code" = "401"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/stats")"
          test "$code" = "401"

          email="security-smoke-$(date +%s%N)@example.test"
          payload="$(EMAIL="$email" node -e 'process.stdout.write(JSON.stringify({email:process.env.EMAIL,password:"SmokeTestPassword2026!",name:"Security Smoke"}))')"
          code="$(curl -sS -c /tmp/apppulse-cookies.txt -H 'Content-Type: application/json' -d "$payload" -o /tmp/apppulse-register.json -w '%{http_code}' "$base/api/auth/register")"
          test "$code" = "201"
          node -e 'const r=require("/tmp/apppulse-register.json"); if(r.user?.role!=="admin" || !r.workspaceId) process.exit(1)'

          code="$(curl -sS -b /tmp/apppulse-cookies.txt -o /tmp/apppulse-session.json -w '%{http_code}' "$base/api/auth/me")"
          test "$code" = "200"
          node -e 'const r=require("/tmp/apppulse-register.json");const s=require("/tmp/apppulse-session.json");if(s.user?.role!=="admin" || s.workspaceId!==r.workspaceId)process.exit(1)'

          code="$(curl -sS -b /tmp/apppulse-cookies.txt -o /dev/null -w '%{http_code}' "$base/api/stats")"
          test "$code" = "200"
          code="$(curl -sS -b /tmp/apppulse-cookies.txt -H 'x-workspace-id: ws_default' -o /dev/null -w '%{http_code}' "$base/api/stats")"
          test "$code" = "403"
          code="$(curl -sS -b /tmp/apppulse-cookies.txt -X POST -o /dev/null -w '%{http_code}' "$base/api/auth/logout")"
          test "$code" = "204"
          code="$(curl -sS -b /tmp/apppulse-cookies.txt -o /dev/null -w '%{http_code}' "$base/api/stats")"
          test "$code" = "401"

          code="$(curl -sS -c /tmp/apppulse-login-cookies.txt -H 'Content-Type: application/json' -d "$payload" -o /tmp/apppulse-login.json -w '%{http_code}' "$base/api/auth/login")"
          test "$code" = "200"
          code="$(curl -sS -b /tmp/apppulse-login-cookies.txt -o /tmp/apppulse-login-session.json -w '%{http_code}' "$base/api/auth/me")"
          test "$code" = "200"
          node -e 'const s=require("/tmp/apppulse-login-session.json");if(s.user?.role!=="admin")process.exit(1)'

          admin_payload="$(EMAIL="$APP_BOOTSTRAP_ADMIN_EMAIL" PASSWORD="$APP_BOOTSTRAP_ADMIN_PASSWORD" node -e 'process.stdout.write(JSON.stringify({email:process.env.EMAIL,password:process.env.PASSWORD}))')"
          code="$(curl -sS -c /tmp/apppulse-admin-cookies.txt -H 'Content-Type: application/json' -d "$admin_payload" -o /tmp/apppulse-admin-login.json -w '%{http_code}' "$base/api/auth/login")"
          test "$code" = "200"
          node -e 'const r=require("/tmp/apppulse-admin-login.json");if(r.user?.role!=="admin" || r.workspaceId!=="ws_default")process.exit(1)'
          code="$(curl -sS -b /tmp/apppulse-admin-cookies.txt -o /tmp/apppulse-admin-session.json -w '%{http_code}' "$base/api/auth/me")"
          test "$code" = "200"
          node -e 'const s=require("/tmp/apppulse-admin-session.json");if(s.user?.role!=="admin" || s.workspaceId!=="ws_default")process.exit(1)'

      - name: Production build
        run: bun run build
