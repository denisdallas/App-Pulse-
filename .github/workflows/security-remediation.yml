name: Security remediation CI

on:
  push:
    branches:
      - security/auth-workspace-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: TypeScript check
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build
